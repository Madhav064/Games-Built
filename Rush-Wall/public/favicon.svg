<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#0088cc"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1">
    <line x1="20" y1="12" x2="20" y2="52"/>
    <line x1="32" y1="12" x2="32" y2="52"/>
    <line x1="44" y1="12" x2="44" y2="52"/>
    <line x1="12" y1="20" x2="52" y2="20"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="12" y1="44" x2="52" y2="44"/>
  </g>
  <!-- Wall (horizontal bar) -->
  <rect x="22" y="30" width="20" height="4" rx="2" fill="#ffc857" opacity="0.9"/>
  <!-- Pawn -->
  <circle cx="26" cy="44" r="5" fill="white" opacity="0.95"/>
</svg>